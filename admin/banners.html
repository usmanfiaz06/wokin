<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WOK!N · Admin · Deals</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#1A1A1A" />
<link rel="icon" type="image/jpeg" href="/Wokin.- logo.jpeg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Caveat:wght@500;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- LOGIN -->
<div class="auth" id="authScreen">
  <div class="auth-card">
    <div class="auth-head">
      <img src="/Wokin.- logo.jpeg" alt="WOK!N" />
      <div>
        <span class="cn">炒</span>
        <b>WOK!N</b>
        <em>ADMIN · BACK-OF-HOUSE</em>
      </div>
    </div>
    <h1>Sign <em>in.</em></h1>
    <p class="auth-sub">Restaurant staff only.</p>
    <form id="loginForm" class="auth-form" novalidate action="javascript:void(0)">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <p class="auth-err" id="authErr" hidden></p>
      <button type="button" id="loginBtn" class="btn-primary big">SIGN IN →</button>
    </form>
  </div>
</div>

<!-- APP -->
<div class="app" id="appScreen" hidden>

  <header class="top">
    <a href="/admin/" class="brand">
      <img src="/Wokin.- logo.jpeg" alt="WOK!N" />
      <span class="cn">炒</span>
      <span class="brand-text">
        <b>WOK!N</b>
        <em>ADMIN</em>
      </span>
    </a>

    <nav class="top-nav">
      <a href="/admin/">ORDERS</a>
      <a href="/admin/menu.html">MENU</a>
      <a href="/admin/coupons.html">COUPONS</a>
      <a href="/admin/hours.html">HOURS</a>
      <a href="/admin/banners.html" class="is-on">★ DEALS</a>
      <a href="/admin/combos.html">COMBOS</a>
    </nav>

    <div class="top-right">
      <span class="who" id="whoami">—</span>
      <button class="btn-ghost small" id="signOut">SIGN OUT</button>
    </div>
  </header>

  <section class="bn-wrap">
    <header class="bn-head">
      <h2><span class="em">🔥</span> Deals banner <small>· scrolls across the top of the customer menu</small></h2>
    </header>

    <div class="bn-add">
      <input type="text" id="bnInput" maxlength="140"
        placeholder="e.g. HAPPY HOURS 4–6 PM · FLAT 20% OFF ON DINE-IN ONLY" />
      <button class="btn-primary" id="bnAdd">+ ADD DEAL</button>
    </div>
    <p class="hint" style="margin:6px 2px 20px">Active deals scroll in a moving banner at the top of the menu. If none are active, the banner is hidden.</p>

    <div class="bn-list" id="bnList"></div>
  </section>

</div>

<!-- TOAST -->
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-client.js"></script>
<script src="/admin/banners.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WOK!N · Admin · Menu</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#1A1A1A" />
<link rel="icon" type="image/jpeg" href="/Wokin.- logo.jpeg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Caveat:wght@500;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- LOGIN -->
<div class="auth" id="authScreen">
  <div class="auth-card">
    <div class="auth-head">
      <img src="/Wokin.- logo.jpeg" alt="WOK!N" />
      <div>
        <span class="cn">炒</span>
        <b>WOK!N</b>
        <em>ADMIN · BACK-OF-HOUSE</em>
      </div>
    </div>
    <h1>Sign <em>in.</em></h1>
    <p class="auth-sub">Restaurant staff only.</p>
    <form id="loginForm" class="auth-form" novalidate action="javascript:void(0)">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <p class="auth-err" id="authErr" hidden></p>
      <button type="button" id="loginBtn" class="btn-primary big">SIGN IN →</button>
    </form>
  </div>
</div>


<!-- APP -->
<div class="app" id="appScreen" hidden>

  <header class="top">
    <a href="/" class="brand">
      <img src="/Wokin.- logo.jpeg" alt="WOK!N" />
      <span class="cn">炒</span>
      <span class="brand-text">
        <b>WOK!N</b>
        <em>ADMIN</em>
      </span>
    </a>

    <nav class="top-nav">
      <a href="/admin/">ORDERS</a>
      <a href="/admin/menu.html" class="is-on">★ MENU</a>
    </nav>

    <div class="top-mid">
      <span class="live-dot"></span>
      <span class="live-text">LIVE</span>
      <span class="separator">·</span>
      <span id="changesCount">0 changes saved</span>
    </div>

    <div class="top-right">
      <span class="who" id="whoami">—</span>
      <button class="btn-ghost small" id="signOut">SIGN OUT</button>
    </div>
  </header>

  <!-- Filter / search bar -->
  <div class="mtools">
    <div class="mtools-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" id="menuSearch" placeholder="Search dishes…" />
    </div>
    <div class="mtools-filters">
      <label class="m-checkbox">
        <input type="checkbox" id="filterSoldOut" />
        <span>Show only sold out</span>
      </label>
      <button class="btn-ghost small" id="resetAll" title="Restore every dish to available, clear all overrides">RESET ALL OVERRIDES</button>
    </div>
  </div>

  <!-- Categories + dishes -->
  <main class="menu-mgmt" id="menuMgmt"></main>

</div>


<!-- EDIT MODAL -->
<div class="modal" id="editModal" hidden>
  <div class="modal-card edit">
    <button class="modal-close" id="editClose" aria-label="Close">✕</button>
    <div class="modal-head">
      <div class="mh-left">
        <span class="mh-eyebrow">EDIT DISH</span>
        <h2 id="editName">—</h2>
        <span class="mh-meta" id="editCat">—</span>
      </div>
    </div>
    <form id="editForm" class="edit-form">
      <div class="field">
        <label class="m-toggle">
          <input type="checkbox" id="editAvailable" />
          <span class="m-toggle-track"></span>
          <span class="m-toggle-text">
            <b>Available right now</b>
            <em>Customers can add this dish to their cart</em>
          </span>
        </label>
      </div>

      <div class="field">
        <label for="editPrice">Price (Rs.)</label>
        <input type="number" id="editPrice" step="5" min="0" />
        <span class="hint" id="editPriceDefault"></span>
      </div>

      <div class="field">
        <label for="editPriceFull">Full size price (Rs.)</label>
        <input type="number" id="editPriceFull" step="5" min="0" />
        <span class="hint" id="editPriceFullDefault"></span>
      </div>

      <div class="field">
        <label for="editPcs">Portion label</label>
        <input type="text" id="editPcs" placeholder="e.g. 8 Pcs" />
        <span class="hint" id="editPcsDefault"></span>
      </div>

      <div class="field">
        <label for="editDesc">Description</label>
        <textarea id="editDesc" rows="3"></textarea>
        <span class="hint" id="editDescDefault"></span>
      </div>

      <div class="modal-actions inline">
        <button type="button" class="act-cancel" id="editClear">↺ CLEAR OVERRIDES</button>
        <button type="submit" class="act-go">✓ SAVE</button>
      </div>
    </form>
  </div>
</div>


<!-- TOAST -->
<div class="toast" id="toast" hidden></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-client.js"></script>
<script src="/menu-data.js"></script>
<script src="/dish-images.js"></script>
<script src="/admin/menu.js"></script>
</body>
</html>

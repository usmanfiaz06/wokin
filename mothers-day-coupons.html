<html lang="en">
<head>
<meta charset="utf-8">
<title>Wokin × NUST — Mother's Day Coupons (400)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Great+Vibes&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };

<style>
  @page { size: A4 portrait; margin: 0; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    color: #2a1014;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    background: #e7e3da;
  }

  /* Helper banner — hidden on print */
  .hint {
    position: fixed; top: 10px; right: 10px; z-index: 9999;
    background: #2a1014; color: #f0c060;
    padding: 10px 14px; border-radius: 8px;
    font-size: 12px; line-height: 1.45; max-width: 320px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.25);
    border: 1px solid #6a2a30;
  }
  .hint b { color: #ffd56b; }
  .hint span { color: #f4ead5; }

  .page {
    width: 210mm; height: 297mm;
    padding: 6mm 0;
    page-break-after: always; break-after: page;
    display: flex; flex-direction: column;
    gap: 11mm;
    background: #fff;
    position: relative;
  }
  .page:last-of-type { page-break-after: auto; break-after: auto; }

  /* Cut guide */
  .cut-line {
    height: 0;
    border-top: 1px dashed #b8893a;
    position: relative;
    margin: -5.5mm 0;
    opacity: 0.55;
  }
  .cut-line::before {
    content: '✂  cut along the dotted line';
    position: absolute;
    top: -3.2mm; left: 50%; transform: translateX(-50%);
    background: #fff; padding: 0 3mm;
    font-size: 7pt; color: #8b6f4e; letter-spacing: 1.6px;
  }

  /* =============== COUPON =============== */
  .coupon {
    width: 100%;
    height: 86mm;
    position: relative;
    overflow: hidden;
    border-radius: 0;
    display: flex;
    color: #2a1014;
    box-shadow:
      0 0 0 0.4mm #b8893a inset,
      0 0.6mm 1.5mm rgba(90,26,31,0.10);
  }

  /* ---- LEFT STUB ---- */
  .stub {
    width: 28mm;
    flex-shrink: 0;
    position: relative;
    background:
      radial-gradient(circle at 50% 100%, rgba(240, 192, 96, 0.18) 0, transparent 55%),
      radial-gradient(circle at 50% 0%, rgba(240, 192, 96, 0.10) 0, transparent 40%),
      linear-gradient(180deg, #5a1a1f 0%, #3a0e13 65%, #2a0a0d 100%);
    color: #f4ead5;
    overflow: hidden;
    border-right: 1px dashed rgba(244, 234, 213, 0.55);
  }
  /* tiny perforation rivets to suggest a tear-off edge */
  .stub::before, .stub::after {
    content: '';
    position: absolute;
    right: -2.5mm;
    width: 5mm; height: 5mm; border-radius: 50%;
    background: #f4ead5;
  }
  .stub::before { top: -2.5mm; }
  .stub::after  { bottom: -2.5mm; }

  .stub-ornament-top, .stub-ornament-bot {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    font-family: 'Playfair Display', serif;
    color: #f0c060;
    font-size: 12pt;
  }
  .stub-ornament-top { top: 3mm; }
  .stub-ornament-bot { bottom: 3mm; }

  .stub-rotate {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    transform-origin: center;
    white-space: nowrap;
    font-family: 'Cinzel', 'Playfair Display', serif;
    font-weight: 700;
    letter-spacing: 7px;
    font-size: 10pt;
    color: #f4ead5;
    text-transform: uppercase;
  }
  .stub-rotate .pct {
    color: #f0c060;
    font-weight: 900;
    letter-spacing: 4px;
  }
  .stub-rotate .sep {
    color: #c89a6b;
    margin: 0 3px;
  }

  /* ---- MAIN PANEL ---- */
  .main {
    flex: 1;
    position: relative;
    background:
      /* very subtle floral motif as a tile */
      url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cg fill='%23b8893a' opacity='0.06'%3E%3Cpath d='M100 60c-6 8-2 18 6 22 8 4 18 0 22-8 4-8 0-18-8-22-8-4-18 0-20 8z'/%3E%3Ccircle cx='100' cy='80' r='3'/%3E%3Cpath d='M40 140c-3 4-1 9 3 11 4 2 9 0 11-4 2-4 0-9-4-11-4-2-9 0-10 4z'/%3E%3Ccircle cx='40' cy='150' r='1.5'/%3E%3Cpath d='M160 130c-3 4-1 9 3 11 4 2 9 0 11-4 2-4 0-9-4-11-4-2-9 0-10 4z'/%3E%3Ccircle cx='160' cy='140' r='1.5'/%3E%3C/g%3E%3C/svg%3E"),
      radial-gradient(circle at 100% 100%, rgba(184, 137, 58, 0.10) 0, transparent 55%),
      radial-gradient(circle at 0% 0%, rgba(168, 49, 42, 0.05) 0, transparent 45%),
      linear-gradient(135deg, #faf3df 0%, #f4ead5 55%, #ecddbf 100%);
    background-size: 50mm 50mm, auto, auto, auto;
    padding: 4.5mm 5mm 3.5mm 5mm;
    display: flex; flex-direction: column;
  }

  /* Inner gold-line decorative frame */
  .frame {
    position: absolute;
    inset: 2.2mm;
    border: 0.3mm solid rgba(184, 137, 58, 0.55);
    border-radius: 1.5mm;
    pointer-events: none;
    z-index: 1;
  }
  /* Small corner accents on the frame */
  .frame::before, .frame::after {
    content: '';
    position: absolute;
    width: 6mm; height: 6mm;
    border: 0.4mm solid #b8893a;
    border-right: none;
    border-bottom: none;
  }
  .frame::before { top: -0.5mm; left: -0.5mm; border-radius: 1.2mm 0 0 0; }
  .frame::after  { bottom: -0.5mm; right: -0.5mm; transform: rotate(180deg); border-radius: 1.2mm 0 0 0; }

  /* === Content === */
  .head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 4mm; height: 12mm;
    position: relative; z-index: 2;
  }
  .wokin-plate {
    background: #1f0a0d;
    border-radius: 1.5mm;
    padding: 1.6mm 3mm;
    display: flex; align-items: center;
    box-shadow: 0 0.4mm 1mm rgba(0,0,0,0.18);
  }
  .wokin-plate img {
    height: 8.5mm; width: auto; display: block;
  }
  .head-center {
    flex: 1;
    text-align: center;
    font-family: 'Cinzel', 'Playfair Display', serif;
    font-size: 6.4pt;
    letter-spacing: 5px;
    color: #8b1a1a;
    font-weight: 700;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 2mm;
    justify-content: center;
  }
  .head-center .swatch {
    flex: 1; height: 0.25mm;
    background: linear-gradient(90deg, transparent, #b8893a 30%, #b8893a 70%, transparent);
    max-width: 22mm;
  }
  .head-center .ornament {
    color: #b8893a; font-size: 8pt; line-height: 1;
  }
  .nust-tile {
    background: #faf3df;
    border-radius: 1.2mm;
    padding: 0.9mm 2.2mm;
    border: 0.25mm solid rgba(184, 137, 58, 0.4);
    display: flex; align-items: center;
  }
  .nust-tile img {
    height: 8.5mm; width: auto; display: block;
  }

  /* === Centre Hero === */
  .hero {
    flex: 1;
    display: grid;
    grid-template-columns: 36mm 1fr 34mm;
    gap: 5mm;
    align-items: center;
    margin: 1mm 0 1.5mm;
    position: relative; z-index: 2;
  }

  /* Circular food image */
  .food-circle {
    width: 34mm; height: 34mm;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    background: #1f0a0d;
    box-shadow:
      0 0 0 0.6mm #faf3df,
      0 0 0 1mm #b8893a,
      0 0 0 1.4mm #faf3df,
      0 0 0 1.7mm rgba(184, 137, 58, 0.45),
      0 1mm 3mm rgba(90, 26, 31, 0.18);
    margin: 0 auto;
  }
  .food-circle img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(1.08) contrast(1.04);
  }

  .title-col { text-align: center; }
  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 6.2pt;
    letter-spacing: 3.8px;
    text-transform: uppercase;
    color: #b8893a;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 1.5mm;
    margin-bottom: 0.6mm;
  }
  .eyebrow .star { color: #8b1a1a; font-size: 6.5pt; }

  h1.script {
    font-family: 'Great Vibes', 'Brush Script MT', cursive;
    font-size: 22pt;
    line-height: 0.92;
    color: #5a1a1f;
    margin: 0 0 0.4mm;
    font-weight: 400;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .divider {
    width: 26mm;
    height: 0.3mm;
    background: linear-gradient(90deg, transparent, #b8893a 40%, #b8893a 60%, transparent);
    margin: 0.8mm auto 1mm;
    position: relative;
  }
  .divider::after {
    content: '✦';
    position: absolute;
    top: -2mm; left: 50%; transform: translateX(-50%);
    color: #b8893a;
    background: #f4ead5;
    padding: 0 1mm;
    font-size: 6pt;
  }
  .subtitle {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 9pt;
    line-height: 1.3;
    color: #5a3a2e;
    margin: 1mm 0 1mm;
  }
  .subtitle .accent { color: #8b1a1a; font-weight: 700; font-style: normal; }

  .signoff {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 8.5pt;
    color: #8b6f4e;
    display: flex; align-items: baseline; justify-content: center; gap: 1.5mm;
  }
  .signoff .heart { color: #8b1a1a; font-style: normal; font-size: 8pt; }
  .signoff strong {
    font-family: 'Inter', sans-serif;
    font-style: normal; font-weight: 700;
    color: #5a1a1f; letter-spacing: 1.2px;
    font-size: 7.4pt;
  }

  /* Right column with badge + QR */
  .right-col {
    display: flex; flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5mm;
  }
  .badge {
    width: 26mm; height: 26mm;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, #c93838 0%, #8b1a1a 60%, #5a0e12 100%);
    color: #f4ead5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border: 0.7mm solid #faf3df;
    outline: 0.3mm dashed #b8893a;
    outline-offset: 1mm;
    box-shadow: 0 1mm 2.5mm rgba(90, 26, 31, 0.30);
    text-align: center;
  }
  .badge .pct {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 15pt; line-height: 1;
    color: #f0c060;
    text-shadow: 0 0.4mm 0 rgba(0,0,0,0.15);
  }
  .badge .pct .sign { font-size: 11pt; color: #ffd56b; }
  .badge .off {
    font-size: 6.5pt;
    letter-spacing: 3px;
    color: #f4ead5;
    font-weight: 700;
    margin-top: 0.4mm;
  }
  .qr-row {
    display: flex; align-items: center; gap: 1.5mm;
  }
  .qr-card {
    background: #faf3df;
    border: 0.25mm solid rgba(184, 137, 58, 0.5);
    border-radius: 1mm;
    padding: 0.8mm;
    box-shadow: 0 0.4mm 1mm rgba(0,0,0,0.12);
  }
  .qr-card img {
    width: 12mm; height: 12mm;
    display: block; background: #fff;
  }
  .scan-label {
    font-size: 5pt;
    color: #5a1a1f;
    letter-spacing: 1.4px;
    font-weight: 700;
    text-transform: uppercase;
    line-height: 1.1;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }

  /* === Footer info === */
  .info {
    position: relative; z-index: 2;
    padding-top: 1.4mm;
    border-top: 0.3mm dashed rgba(184, 137, 58, 0.55);
    font-size: 6.6pt;
    color: #3a1a1f;
  }
  .info .row {
    display: flex; justify-content: space-between;
    gap: 4mm; line-height: 1.2;
    padding: 0.25mm 0;
  }
  .info .label {
    color: #b8893a; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    font-size: 5.7pt; margin-right: 1.2mm;
  }
  .info .value { color: #2a1014; font-weight: 500; white-space: nowrap; }
  .info .serial-val { color: #8b1a1a; font-weight: 800; letter-spacing: 1.4px; }
  .info .item { display: flex; align-items: baseline; white-space: nowrap; }

  .terms {
    font-size: 5.5pt;
    color: #8b6f4e;
    text-align: center;
    letter-spacing: 0.4px;
    margin-top: 0.6mm;
    line-height: 1.2;
  }
  .terms b {
    color: #b8893a; font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    margin-right: 0.8mm;
  }

  @media print {
    body { background: #fff; }
    .hint { display: none !important; }
    .page { padding: 6mm 0; }
  }
</style>
</head>
